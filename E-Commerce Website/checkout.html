<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Exist</title>

  <!-- CSS LINK -->
  <link rel="stylesheet" href="checkout.css">
</head>
<body>
  <div class="checkout-container">
    <h1>Checkout</h1>
    <div class="brand-logo">
  <img src="src/Picsart_26-01-07_22-01-45-371.png" alt="Exist Brand Logo">
</div>

<!-- ORDER SUMMARY -->
<div class="order-summary">
  <h2>Order Summary</h2>
  <div id="orderItems"></div>
  <h3>Total: ₹<span id="orderTotal">0</span></h3>
</div>


    
    <!-- Shipping Details -->
    <form method="post" id="checkoutForm">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      
      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" name="address" required></textarea>
      </div>
      
      <div class="form-group">
        <label for="state">State</label>
        <input type="text" id="state" name="state" required>
      </div>
      
      <div class="form-group">
        <label for="pincode">Pincode</label>
        <input type="text" id="pincode" name="pincode" required pattern="\d{6}">
      </div>

      <div class="form-group">
        <label for="number">Number</label>
        <input type="text" id="number" name="number" required">
      </div>
      
      <!-- Payment Method -->
      <div class="form-group">
        <label>Payment Method</label>
        <select id="payment" name="payment" required>
          <option value="">Select Payment</option>
          <option value="cod">Cash on Delivery</option>
          <option value="upi">UPI</option>
          <option value="credit">Credit Card</option>
          <option value="debit">Debit Card</option>
        </select>
      </div>

      <button type="submit" class="btn">Confirm Order</button>
    </form>
  </div>


  <!-- Order Success Popup -->
<div class="popup-overlay" id="orderPopup">
  <div class="popup-box">
    <h2>🎉 Order Successful!</h2>
    <p>Your order has been placed successfully.</p>
    <button onclick="closePopup()">OK</button>
  </div>
</div>

  <script>
    jQuery('#checkoutForm').on('submit', function(e) {
      event.preventDefault();
      // Add form validation and submission logic here
      jQuery.ajax({
        url: 'https://script.google.com/macros/s/AKfycbzXEt7Zx3ZquAqoreolWxQDBuAU7MZM8XEG6cTVHia-k2GrgULJ3jJl7_LnZjYbZ4Hj/exec',
        method: 'POST',
        data: jQuery('#checkoutForm').serialize(),
        success: function(result) {
          console.log(result);
        }
      });
    });
  </script>

  <script src="checkout.js"></script>
</body>
</html>
